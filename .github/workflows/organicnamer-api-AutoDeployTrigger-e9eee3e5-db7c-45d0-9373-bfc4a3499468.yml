name: Trigger auto deployment for organicnamer-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/organicnamer-api-AutoDeployTrigger-e9eee3e5-db7c-45d0-9373-bfc4a3499468.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ORGANICNAMERAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ORGANICNAMERAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ORGANICNAMERAPI_AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: organicnameracr.azurecr.io
          registryUsername: ${{ secrets.ORGANICNAMERAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ORGANICNAMERAPI_REGISTRY_PASSWORD }}
          containerAppName: organicnamer-api
          resourceGroup: OrganicNamerRG
          imageToBuild: organicnameracr.azurecr.io/organicnamer-api:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_

